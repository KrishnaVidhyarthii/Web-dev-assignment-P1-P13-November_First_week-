<!DOCTYPE html>
<html>
<head>
    <title>P8 Projects</title>

    <style>
        body{
            font-family:Arial;
            margin:30px;
            background:#f5f5f5;
        }
        h1{
            text-align:center;
        }
        .projects{
            display:grid;
            grid-template-columns:2fr 1fr 1fr;
            grid-template-rows:200px 200px;
            gap:20px;
        }
        .project{
            background:white;
            border:1px solid #ccc;
            padding:20px;
        }
        .project1{
            grid-row:span 2;
        }
        .project2{
            grid-column:span 2;
        }
        .larder{
            font-size: 30px;
        }
    </style>
</head>
<body>
<h1>My Projects</h1>
<div class="projects">
    <div class="project project1">
        <h2>Project 1</h2>
        <p>Land Aquisition <span class = "larder">& </span> Management System</p>
    </div>
    <div class="project project2">
        <h2>Project 2</h2>
        <p>Basic Html/Css Pages</p>
    </div>
    <div class="project">
        <h2>Project 3</h2>
        <p>Fedora tweaks / utilities</p>
    </div>
    <div class="project">
        <h2>Project 4</h2>
        <p>Calculator</p>
    </div>
</body>
</html>
