<!DOCTYPE html>
<html>
<head>
    <title>P3 reuse color</title>

    <style>
        :root{
            --main-color:black;
            --button-color:blue;
            --background:#f5f5f5;
            --space:20px;
        }

        body{
            font-family:Arial;
            font-size:16px;
            line-height:1.5;
            margin:0;
            padding:20px;
            background:var(--background);
        }
        h1{
            font-size:32px;
            font-weight:bold;
        }

        h2{
            font-size:24px;
        }

        p{
            font-size:16px;
        }

        .card{
            background:white;
            padding:var(--space);
            margin:var(--space);
            border:1px solid black;
        }

        button{
            background:var(--button-color);
            color:white;
            border:none;
            padding:10px 20px;
            font-size:16px;
        }
    </style>
</head>
<body>
    <h1>Test Website</h1>
    <p>The quick brown fox jumps over the lazy dog.</p>
    <div class="card">
        <h2>Click "here" if you like blahaj!!</h2>
        <p>Blahaj is cool, cute and comfy.</p>
        <button>Click Here</button>
    </div>
</body>
</html>
