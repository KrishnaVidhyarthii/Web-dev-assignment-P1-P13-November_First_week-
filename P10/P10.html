<!DOCTYPE html>
<html>
<head>
    <title>P6 header/footer</title>

    <style>
        body{
            margin:0;
            font-family:Arial;
        }
        header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 40px;
            background:black;
            color:white;
        }
        nav{
            display:flex;
            gap:25px;
        }

        nav a{
            color:white;
            text-decoration:none;
        }

        .content{
            min-height:500px;
            padding:30px;
        }

        footer{
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:black;
            color:white;
            padding:20px 40px;
        }

        .social{
            display:flex;
            gap:20px;
        }

        @media (max-width: 600px){
            header, footer {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>Portfolio</h2>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
    </nav>
</header>
<div class="content">
    <h1>Hi.</h1>
    <p>This is a portfoio.</p>
</div>

<footer>
    <p>© 2026 Portfolio</p>
    <div class="social">
        <span>Email</span>
        <span>LinkedIn</span>
        <span>GitHub</span>
    </div>
</footer>
</body>
</html>
